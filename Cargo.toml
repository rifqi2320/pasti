[package]
name = "pasti-lint"
version = "0.1.0"
edition = "2024"
description = "Linter buat PASTI (Panduan Standardisasi Teks dan Istilah), spec bahasa Indonesia teknis terkendali"
readme = "README.md"
repository = "https://github.com/rifqi2320/pasti"
keywords = ["linter", "indonesian", "controlled-language", "technical-writing"]
categories = ["command-line-utilities", "text-processing"]

[[bin]]
name = "pasti"
path = "src/main.rs"

[lib]
name = "pasti_lint"
path = "src/lib.rs"

[dependencies]
clap = { version = "4.6.10", features = ["derive"] }
pulldown-cmark = { version = "0.13.6", default-features = false }
regex = "1.13.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_yaml = "0.9.34"
sha2 = "0.11.2"
